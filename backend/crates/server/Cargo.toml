[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum       = { version = "0.7", features = ["multipart"] }
gds-parser = { path = "../gds-parser" }
layout-db  = { path = "../layout-db" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
